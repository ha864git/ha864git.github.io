<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二足歩行ロボット脚のシミュレーション</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            touch-action: none; /* Disable pinch-zoom on mobile */
        }
        canvas {
            background-color: #f1f5f9; /* slate-100 */
            border: 1px solid #cbd5e1; /* slate-300 */
            border-radius: 0.5rem;
        }
        .control-label {
            font-size: 0.875rem;
            color: #475569; /* slate-600 */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-center text-slate-700 mb-4">ロボット脚 シミュレーション</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md">
            <!-- Canvas for the simulation -->
            <canvas id="simulationCanvas" width="600" height="400"></canvas>

            <!-- Controls for the joints -->
            <div class="mt-6 space-y-4">
                <div>
                    <label for="hipSlider" class="control-label block mb-1">腰関節 (Hip Joint)</label>
                    <input id="hipSlider" type="range" min="-90" max="90" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <label for="kneeSlider" class="control-label block mb-1">膝関節 (Knee Joint)</label>
                    <input id="kneeSlider" type="range" min="-120" max="0" value="-30" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-sm text-slate-500 bg-white p-4 rounded-lg shadow-md">
            <h2 class="font-semibold text-slate-600 mb-2">構成詳細</h2>
            <ul class="list-disc list-inside space-y-1">
                <li><span class="font-semibold">腰 (青):</span> 固定部。A1とB1の2軸。</li>
                <li><span class="font-semibold">腿 (緑):</span> サーボモーターを搭載。A21/A22とS_upper/S_lowerの4軸を持つ。</li>
                <li><span class="font-semibold">足首 (赤):</span> 脚の先端。A3とB3の2軸。</li>
                <li><span class="font-semibold">アーム (灰):</span> 各パーツを接続する20mmのアーム。</li>
            </ul>
        </div>
    </div>

    <script>
        // --- Setup ---
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const hipSlider = document.getElementById('hipSlider');
        const kneeSlider = document.getElementById('kneeSlider');

        // --- Constants (from user description) ---
        // スケールを大きくして見やすくする (1mm = 3px)
        const SCALE = 3; 
        const HIP_WIDTH = 30 * SCALE;      // A1-B1
        const ANKLE_WIDTH = 30 * SCALE;    // A3-B3
        const THIGH_WIDTH = 30 * SCALE;    // A21-S_upper, A22-S_lower
        const THIGH_HEIGHT = 20 * SCALE;   // S_upper-S_lower
        const ARM_LENGTH = 20 * SCALE;     // All connecting arms

        // --- Helper Functions ---
        /**
         * Converts degrees to radians.
         * @param {number} degrees
         * @returns {number}
         */
        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        /**
         * Draws a line between two points.
         * @param {object} p1 - {x, y}
         * @param {object} p2 - {x, y}
         * @param {string} color
         * @param {number} lineWidth
         */
        function drawLine(p1, p2, color = 'black', lineWidth = 2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        /**
         * Draws a joint (a circle) at a given point.
         * @param {object} p - {x, y}
         * @param {string} label
         * @param {string} color
         */
        function drawJoint(p, label, color = '#475569') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.font = '12px Inter';
            ctx.fillStyle = '#1e293b';
            ctx.fillText(label, p.x + 8, p.y + 4);
        }

        // --- Main Simulation Logic ---
        function draw() {
            // Get current angles from sliders
            const hipAngle = toRadians(parseFloat(hipSlider.value));
            const kneeAngle = toRadians(parseFloat(kneeSlider.value));

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- Kinematic Calculations ---
            // Based on the parallelogram linkage interpretation.

            // 1. Define Hip (fixed base)
            const canvasCenter = { x: canvas.width / 2, y: 50 };
            const A1 = { x: canvasCenter.x - HIP_WIDTH / 2, y: canvasCenter.y };
            const B1 = { x: canvasCenter.x + HIP_WIDTH / 2, y: canvasCenter.y };

            // 2. Calculate Thigh position based on hip angle
            // This forms the upper parallelogram: A1-B1-S_upper-A21
            const A21 = {
                x: A1.x + ARM_LENGTH * Math.cos(hipAngle + Math.PI / 2),
                y: A1.y + ARM_LENGTH * Math.sin(hipAngle + Math.PI / 2)
            };
            const S_upper = {
                x: B1.x + (A21.x - A1.x),
                y: B1.y + (A21.y - A1.y)
            };

            // 3. Calculate the rest of the thigh frame (rigid body)
            // The thigh frame (A21, S_upper, S_lower, A22) is a rigid rectangle.
            const thighAxisVec = { x: S_upper.x - A21.x, y: S_upper.y - A21.y };
            const thighAngle = Math.atan2(thighAxisVec.y, thighAxisVec.x);
            
            const A22 = {
                x: A21.x + THIGH_HEIGHT * Math.cos(thighAngle + Math.PI / 2),
                y: A21.y + THIGH_HEIGHT * Math.sin(thighAngle + Math.PI / 2)
            };
            const S_lower = {
                x: S_upper.x + THIGH_HEIGHT * Math.cos(thighAngle + Math.PI / 2),
                y: S_upper.y + THIGH_HEIGHT * Math.sin(thighAngle + Math.PI / 2)
            };

            // 4. Calculate Ankle position based on knee angle
            // This forms the lower parallelogram: A22-S_lower-B3-A3
            // The knee angle is relative to the thigh's orientation.
            const absoluteKneeAngle = thighAngle + kneeAngle;
            const A3 = {
                x: A22.x + ARM_LENGTH * Math.cos(absoluteKneeAngle + Math.PI / 2),
                y: A22.y + ARM_LENGTH * Math.sin(absoluteKneeAngle + Math.PI / 2)
            };
            const B3 = {
                x: S_lower.x + (A3.x - A22.x),
                y: S_lower.y + (A3.y - A22.y)
            };
            
            // --- Drawing ---
            // Draw links first, so joints are on top.
            const linkColor = '#94a3b8'; // slate-400
            const linkWidth = 4;
            
            // Arms
            drawLine(A1, A21, linkColor, linkWidth);
            drawLine(B1, S_upper, linkColor, linkWidth);
            drawLine(A22, A3, linkColor, linkWidth);
            drawLine(S_lower, B3, linkColor, linkWidth);

            // Main segments
            const hipColor = '#3b82f6'; // blue-500
            const thighColor = '#10b981'; // emerald-500
            const ankleColor = '#ef4444'; // red-500
            const segmentWidth = 8;

            drawLine(A1, B1, hipColor, segmentWidth); // Hip
            drawLine(A21, S_upper, thighColor, segmentWidth); // Thigh top
            drawLine(A22, S_lower, thighColor, segmentWidth); // Thigh bottom
            drawLine(A21, A22, thighColor, segmentWidth); // Thigh side
            drawLine(S_upper, S_lower, thighColor, segmentWidth); // Thigh side
            drawLine(A3, B3, ankleColor, segmentWidth); // Ankle

            // Draw joints
            drawJoint(A1, 'A1');
            drawJoint(B1, 'B1');
            drawJoint(A21, 'A21');
            drawJoint(S_upper, 'S_upper');
            drawJoint(A22, 'A22');
            drawJoint(S_lower, 'S_lower');
            drawJoint(A3, 'A3');
            drawJoint(B3, 'B3');
        }

        // --- Animation Loop ---
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        // Initial call
        animate();
    </script>

</body>
</html>
